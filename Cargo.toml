[package]
name = "raft-kv"
version = "0.1.0"
edition = "2024"
description = "A Raft-replicated, linearizable key-value store with a deterministic simulation test harness"
license = "MIT"
repository = "https://github.com/TejasBaid/raft-kv-store"
rust-version = "1.85"
readme = "README.md"
keywords = ["raft", "consensus", "distributed-systems", "key-value", "simulation"]

[dependencies]
bincode = "1.3"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.2"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
debug = 1

# The simulation tests are CPU-bound; optimise them even in `cargo test`.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
